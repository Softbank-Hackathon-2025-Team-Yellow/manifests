apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # ✅ backend 노드 그룹에만 스케줄링
      nodeSelector:
        group: backend

      containers:
        - name: backend
          image: docker.io/ytjdud79/backend:9f75e4b
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: ENV
              value: "dev"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

